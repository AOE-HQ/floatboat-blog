<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Browser agent threat model</title><desc id="d">User, model, web content and integrations converge on an authenticated browser session, constrained by permissions, confirmation, isolation and logs.</desc><rect width="1200" height="675" fill="#f6f0e4"/><rect x="38" y="38" width="1124" height="599" rx="28" fill="#fffaf0" stroke="#25231f" stroke-width="3"/><text x="78" y="102" font-family="Arial" font-size="34" font-weight="700" fill="#25231f">Secure the blast radius, not only the model</text><g font-family="Arial" text-anchor="middle"><g fill="#f0c66d"><rect x="75" y="165" width="210" height="95" rx="16"/><rect x="345" y="165" width="210" height="95" rx="16"/><rect x="645" y="165" width="210" height="95" rx="16"/><rect x="915" y="165" width="210" height="95" rx="16"/></g><g font-size="22" font-weight="700" fill="#25231f"><text x="180" y="205">User</text><text x="450" y="205">Model</text><text x="750" y="205">Web content</text><text x="1020" y="205">Integration</text></g><g font-size="15" fill="#25231f"><text x="180" y="235">ambiguous goal</text><text x="450" y="235">mistake or drift</text><text x="750" y="235">injection or deception</text><text x="1020" y="235">excess access</text></g><g stroke="#9a4e3c" stroke-width="4"><path d="M180 260L500 355"/><path d="M450 260L550 350"/><path d="M750 260L650 350"/><path d="M1020 260L700 355"/></g><rect x="420" y="345" width="360" height="105" rx="18" fill="#d7aa9b" stroke="#25231f" stroke-width="2"/><text x="600" y="386" font-size="25" font-weight="700" fill="#25231f">Authenticated session</text><text x="600" y="420" font-size="17" fill="#25231f">email · CRM · files · admin tools</text><g fill="#a8bdac"><rect x="85" y="515" width="230" height="70" rx="14"/><rect x="350" y="515" width="230" height="70" rx="14"/><rect x="615" y="515" width="230" height="70" rx="14"/><rect x="880" y="515" width="230" height="70" rx="14"/></g><g font-size="17" font-weight="700" fill="#25231f"><text x="200" y="557">Least privilege</text><text x="465" y="557">Fresh confirmation</text><text x="730" y="557">Profile isolation</text><text x="995" y="557">Logs + recovery</text></g></g></svg>
