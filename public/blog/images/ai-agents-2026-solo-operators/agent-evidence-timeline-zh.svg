<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent 一手证据时间线</title><desc id="desc">从 computer use 和 MCP，到基金会治理、安全标准工作与 AI 采用调查的五个日期节点。</desc>
  <rect width="1200" height="720" rx="32" fill="#0b1020"/>
  <text x="70" y="82" fill="#f8fafc" font-family="Arial, Microsoft YaHei, sans-serif" font-size="34" font-weight="700">AI Agent：看证据，不画炒作曲线</text>
  <text x="70" y="122" fill="#94a3b8" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19">产品能力、基础设施、治理与采用率是不同信号</text>
  <line x1="120" y1="350" x2="1080" y2="350" stroke="#475569" stroke-width="6"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <g><circle cx="150" cy="350" r="18" fill="#22d3ee"/><text x="88" y="300" fill="#67e8f9" font-size="18" font-weight="700">2024-10-22</text><text x="80" y="398" fill="#f8fafc" font-size="20" font-weight="700">Computer use 公测</text><text x="85" y="426" fill="#94a3b8" font-size="16">模型开始操作界面</text></g>
    <g><circle cx="365" cy="350" r="18" fill="#2dd4bf"/><text x="303" y="300" fill="#5eead4" font-size="18" font-weight="700">2024-11-25</text><text x="315" y="398" fill="#f8fafc" font-size="20" font-weight="700">MCP 发布</text><text x="292" y="426" fill="#94a3b8" font-size="16">开放的工具与数据协议</text></g>
    <g><circle cx="590" cy="350" r="18" fill="#a78bfa"/><text x="528" y="300" fill="#c4b5fd" font-size="18" font-weight="700">2025-12-09</text><text x="530" y="398" fill="#f8fafc" font-size="20" font-weight="700">AAIF 成立</text><text x="500" y="426" fill="#94a3b8" font-size="16">进入中立基金会治理</text></g>
    <g><circle cx="815" cy="350" r="18" fill="#fb7185"/><text x="745" y="300" fill="#fda4af" font-size="18" font-weight="700">2026-01 至 05</text><text x="755" y="398" fill="#f8fafc" font-size="20" font-weight="700">NIST Agent 安全</text><text x="748" y="426" fill="#94a3b8" font-size="16">身份与授权成为议题</text></g>
    <g><circle cx="1040" cy="350" r="18" fill="#fbbf24"/><text x="978" y="300" fill="#fde68a" font-size="18" font-weight="700">2026-04-03</text><text x="965" y="398" fill="#f8fafc" font-size="20" font-weight="700">美联储采用报告</text><text x="940" y="426" fill="#94a3b8" font-size="16">AI 使用不等于 Agent 部署</text></g>
  </g>
  <rect x="120" y="525" width="960" height="105" rx="20" fill="#172554"/>
  <text x="600" y="566" text-anchor="middle" fill="#dbeafe" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700">证据真正支持的结论</text>
  <text x="600" y="601" text-anchor="middle" fill="#bfdbfe" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18">工具调用更容易搭建，也更需要限制、观察与评测。</text>
</svg>
