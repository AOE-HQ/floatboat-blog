<svg xmlns="http://www.w3.org/2000/svg" width="640" height="800" viewBox="0 0 640 800" role="img" aria-labelledby="title desc"><title id="title">From request to delivery</title><desc id="desc">Subscribed messages provide context, not new authority.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6466f1"/></marker></defs><rect width="640" height="800" rx="24" fill="#f1efea"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="320" y="52" text-anchor="middle" font-size="28" fill="#1b1a18">From request to delivery</text><rect x="60" y="85" width="520" height="92" rx="16" fill="#fffdf8" stroke="#c9c5d1"/><circle cx="100" cy="130" r="19" fill="#eeebf5"/><text x="100" y="138" text-anchor="middle" font-size="22" fill="#6550a5">1</text><text x="142" y="123" font-size="26" fill="#1b1a18">GitHub / Feishu</text><text x="142" y="155" font-size="21" fill="#56514c">Incoming event</text><path d="M320 180V203" stroke="#6466f1" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="211" width="520" height="92" rx="16" fill="#fffdf8" stroke="#c9c5d1"/><circle cx="100" cy="256" r="19" fill="#eeebf5"/><text x="100" y="264" text-anchor="middle" font-size="22" fill="#6550a5">2</text><text x="142" y="249" font-size="26" fill="#1b1a18">Policy and routing</text><text x="142" y="281" font-size="21" fill="#56514c">Evaluate a new request</text><path d="M320 306V329" stroke="#6466f1" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="337" width="520" height="92" rx="16" fill="#fffdf8" stroke="#c9c5d1"/><circle cx="100" cy="382" r="19" fill="#eeebf5"/><text x="100" y="390" text-anchor="middle" font-size="22" fill="#6550a5">3</text><text x="142" y="375" font-size="26" fill="#1b1a18">Ticket + Mandate</text><text x="142" y="407" font-size="21" fill="#56514c">Task and authorized scope</text><path d="M320 432V455" stroke="#6466f1" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="463" width="520" height="92" rx="16" fill="#fffdf8" stroke="#c9c5d1"/><circle cx="100" cy="508" r="19" fill="#eeebf5"/><text x="100" y="516" text-anchor="middle" font-size="22" fill="#6550a5">4</text><text x="142" y="501" font-size="26" fill="#1b1a18">Worker session</text><text x="142" y="533" font-size="21" fill="#56514c">Execute in a task directory</text><path d="M320 558V581" stroke="#6466f1" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="589" width="520" height="92" rx="16" fill="#fffdf8" stroke="#c9c5d1"/><circle cx="100" cy="634" r="19" fill="#eeebf5"/><text x="100" y="642" text-anchor="middle" font-size="22" fill="#6550a5">5</text><text x="142" y="627" font-size="26" fill="#1b1a18">Original conversation</text><text x="142" y="659" font-size="21" fill="#56514c">Reply / pull request</text><path d="M60 737H580" stroke="#d2cec5"/><text x="320" y="773" text-anchor="middle" font-size="19" fill="#56514c">Subscribed messages provide context, not new authority.</text></g></svg>