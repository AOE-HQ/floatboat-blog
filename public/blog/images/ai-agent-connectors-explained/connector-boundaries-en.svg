<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">AI agent connector control boundaries</title>
  <desc id="desc">A workflow from user intent through host policy, connector tools, identity and resource permissions, followed by approval and audit.</desc>
  <rect width="1200" height="560" fill="#f7f0e5"/>
  <text x="64" y="72" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17131f">A connector is a chain of control boundaries</text>
  <text x="64" y="108" font-family="Arial, sans-serif" font-size="18" fill="#554e5d">A successful sign-in is only one gate in the path from intent to action.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(64 165)"><rect width="180" height="112" rx="14" fill="#fff" stroke="#17131f" stroke-width="2"/><text x="90" y="43" text-anchor="middle" font-size="17" font-weight="700">User intent</text><text x="90" y="72" text-anchor="middle" font-size="14" fill="#625a69">task and limits</text></g>
    <g transform="translate(287 165)"><rect width="180" height="112" rx="14" fill="#ede4ff" stroke="#6f43c0" stroke-width="3"/><text x="90" y="43" text-anchor="middle" font-size="17" font-weight="700">Host policy</text><text x="90" y="72" text-anchor="middle" font-size="14" fill="#625a69">tool + approval</text></g>
    <g transform="translate(510 165)"><rect width="180" height="112" rx="14" fill="#fff" stroke="#17131f" stroke-width="2"/><text x="90" y="43" text-anchor="middle" font-size="17" font-weight="700">Connector</text><text x="90" y="72" text-anchor="middle" font-size="14" fill="#625a69">schema + validation</text></g>
    <g transform="translate(733 165)"><rect width="180" height="112" rx="14" fill="#fff" stroke="#17131f" stroke-width="2"/><text x="90" y="43" text-anchor="middle" font-size="17" font-weight="700">Identity</text><text x="90" y="72" text-anchor="middle" font-size="14" fill="#625a69">OAuth + role</text></g>
    <g transform="translate(956 165)"><rect width="180" height="112" rx="14" fill="#fff" stroke="#17131f" stroke-width="2"/><text x="90" y="43" text-anchor="middle" font-size="17" font-weight="700">Resource</text><text x="90" y="72" text-anchor="middle" font-size="14" fill="#625a69">record permissions</text></g>
    <g fill="#6f43c0"><path d="M252 216h25v10h-25z"/><path d="m277 221-14-10v20z"/><path d="M475 216h25v10h-25z"/><path d="m500 221-14-10v20z"/><path d="M698 216h25v10h-25z"/><path d="m723 221-14-10v20z"/><path d="M921 216h25v10h-25z"/><path d="m946 221-14-10v20z"/></g>
    <path d="M1046 295v72H377v-72" fill="none" stroke="#6f43c0" stroke-width="4" stroke-dasharray="9 8"/>
    <g transform="translate(287 390)"><rect width="180" height="96" rx="14" fill="#ffd966" stroke="#17131f" stroke-width="2"/><text x="90" y="38" text-anchor="middle" font-size="17" font-weight="700">Approve / deny</text><text x="90" y="66" text-anchor="middle" font-size="14">before consequence</text></g>
    <g transform="translate(733 390)"><rect width="180" height="96" rx="14" fill="#17131f"/><text x="90" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Audit</text><text x="90" y="66" text-anchor="middle" font-size="14" fill="#d9d2df">actor · target · result</text></g>
    <path d="M477 438h246" stroke="#17131f" stroke-width="3"/><path d="m723 438-15-10v20z" fill="#17131f"/>
  </g>
</svg>
