<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">工作中个人 AI 使用的四级任务</title><desc id="d">任务从公开信息过渡到受限数据，对账号、数据和审批的要求递增。</desc><rect width="1200" height="675" fill="#f6f0e4"/><rect x="40" y="40" width="1120" height="595" rx="28" fill="#fffaf0" stroke="#25231f" stroke-width="3"/><text x="80" y="105" font-family="Arial,'Microsoft YaHei'" font-size="34" font-weight="700" fill="#25231f">选助手之前，先给任务分级</text><g font-family="Arial,'Microsoft YaHei'" fill="#25231f"><g transform="translate(85 175)"><rect width="240" height="300" rx="18" fill="#f0c66d"/><text x="22" y="48" font-size="24" font-weight="700">1 · 公开</text><text x="22" y="92" font-size="17">公开来源</text><text x="22" y="122" font-size="17">通用规划</text><text x="22" y="235" font-size="16" font-weight="700">默认</text><text x="22" y="267" font-size="15">政策允许时可用个人账号</text></g><g transform="translate(345 175)"><rect width="240" height="300" rx="18" fill="#e8b981"/><text x="22" y="48" font-size="24" font-weight="700">2 · 内部</text><text x="22" y="92" font-size="17">低敏感信息</text><text x="22" y="122" font-size="17">自己的笔记</text><text x="22" y="235" font-size="16" font-weight="700">默认</text><text x="22" y="267" font-size="15">已批准工作账号</text></g><g transform="translate(605 175)"><rect width="240" height="300" rx="18" fill="#d7aa9b"/><text x="22" y="48" font-size="24" font-weight="700">3 · 保密</text><text x="22" y="92" font-size="17">客户或员工数据</text><text x="22" y="122" font-size="17">代码 · 合同</text><text x="22" y="235" font-size="16" font-weight="700">默认</text><text x="22" y="267" font-size="15">只用托管环境</text></g><g transform="translate(865 175)"><rect width="240" height="300" rx="18" fill="#9faeb5"/><text x="22" y="48" font-size="24" font-weight="700">4 · 受限</text><text x="22" y="92" font-size="17">机密 · 健康 · 支付</text><text x="22" y="122" font-size="17">约束性决策</text><text x="22" y="235" font-size="16" font-weight="700">默认</text><text x="22" y="267" font-size="15">需特定授权</text></g><path d="M110 545H1080" stroke="#25231f" stroke-width="3"/><path d="M1080 545l-18-10v20z" fill="#25231f"/><text x="80" y="590" font-size="17" font-weight="700">较低后果</text><text x="945" y="590" font-size="17" font-weight="700">更强控制</text></g></svg>
