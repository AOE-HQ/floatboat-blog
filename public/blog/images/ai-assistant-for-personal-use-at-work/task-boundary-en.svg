<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Four task levels for personal AI at work</title><desc id="d">Tasks progress from public to restricted, with stronger account, data and approval requirements.</desc><rect width="1200" height="675" fill="#f6f0e4"/><rect x="40" y="40" width="1120" height="595" rx="28" fill="#fffaf0" stroke="#25231f" stroke-width="3"/><text x="80" y="105" font-family="Arial" font-size="34" font-weight="700" fill="#25231f">Classify the task before choosing the assistant</text><g font-family="Arial" fill="#25231f"><g transform="translate(85 175)"><rect width="240" height="300" rx="18" fill="#f0c66d"/><text x="22" y="48" font-size="24" font-weight="700">1 · Public</text><text x="22" y="92" font-size="17">Public sources</text><text x="22" y="122" font-size="17">Generic planning</text><text x="22" y="235" font-size="16" font-weight="700">Default</text><text x="22" y="267" font-size="15">Personal account may fit</text></g><g transform="translate(345 175)"><rect width="240" height="300" rx="18" fill="#e8b981"/><text x="22" y="48" font-size="24" font-weight="700">2 · Internal</text><text x="22" y="92" font-size="17">Low sensitivity</text><text x="22" y="122" font-size="17">Own notes</text><text x="22" y="235" font-size="16" font-weight="700">Default</text><text x="22" y="267" font-size="15">Approved work account</text></g><g transform="translate(605 175)"><rect width="240" height="300" rx="18" fill="#d7aa9b"/><text x="22" y="48" font-size="24" font-weight="700">3 · Confidential</text><text x="22" y="92" font-size="17">Client or employee data</text><text x="22" y="122" font-size="17">Code · contracts</text><text x="22" y="235" font-size="16" font-weight="700">Default</text><text x="22" y="267" font-size="15">Managed environment only</text></g><g transform="translate(865 175)"><rect width="240" height="300" rx="18" fill="#9faeb5"/><text x="22" y="48" font-size="24" font-weight="700">4 · Restricted</text><text x="22" y="92" font-size="17">Secrets · health · payment</text><text x="22" y="122" font-size="17">Binding decisions</text><text x="22" y="235" font-size="16" font-weight="700">Default</text><text x="22" y="267" font-size="15">Specific authorization</text></g><path d="M110 545H1080" stroke="#25231f" stroke-width="3"/><path d="M1080 545l-18-10v20z" fill="#25231f"/><text x="80" y="590" font-size="17" font-weight="700">LOWER CONSEQUENCE</text><text x="880" y="590" font-size="17" font-weight="700">STRONGER CONTROL</text></g></svg>
