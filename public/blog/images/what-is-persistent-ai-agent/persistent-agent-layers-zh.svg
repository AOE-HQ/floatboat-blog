<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent 持久化状态分层</title>
  <desc id="desc">模型调用之外还有会话上下文、运行状态、持久记忆、检索、事实源以及评测审计，各层承担不同责任。</desc>
  <rect width="1200" height="720" rx="32" fill="#0b1020"/>
  <text x="70" y="78" fill="#f8fafc" font-family="Arial, Microsoft YaHei, sans-serif" font-size="34" font-weight="700">持久化是一套系统，不是模型功能</text>
  <text x="70" y="118" fill="#94a3b8" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19">每一层都有不同的责任人、生命周期与事实来源</text>
  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <rect x="70" y="165" width="1060" height="76" rx="18" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <text x="95" y="198" fill="#dbeafe" font-size="22" font-weight="700">身份与策略</text><text x="95" y="226" fill="#bfdbfe" font-size="17">租户 · 用户 · 项目 · 角色 · 审批边界</text>
    <rect x="70" y="261" width="510" height="106" rx="18" fill="#164e63"/>
    <text x="95" y="298" fill="#cffafe" font-size="21" font-weight="700">会话上下文</text><text x="95" y="328" fill="#a5f3fc" font-size="17">近期对话 · 压缩历史</text><text x="95" y="352" fill="#a5f3fc" font-size="17">负责短期连续性</text>
    <rect x="620" y="261" width="510" height="106" rx="18" fill="#134e4a"/>
    <text x="645" y="298" fill="#ccfbf1" font-size="21" font-weight="700">运行状态</text><text x="645" y="328" fill="#99f6e4" font-size="17">检查点 · 重试 · 审批 · 回执</text><text x="645" y="352" fill="#99f6e4" font-size="17">负责安全暂停与恢复</text>
    <rect x="70" y="387" width="330" height="116" rx="18" fill="#3f3f46"/>
    <text x="95" y="424" fill="#f4f4f5" font-size="21" font-weight="700">持久记忆</text><text x="95" y="454" fill="#d4d4d8" font-size="17">筛选后的事实与偏好</text><text x="95" y="479" fill="#d4d4d8" font-size="17">来源 · 过期 · 纠正</text>
    <rect x="435" y="387" width="330" height="116" rx="18" fill="#3f3f46"/>
    <text x="460" y="424" fill="#f4f4f5" font-size="21" font-weight="700">检索</text><text x="460" y="454" fill="#d4d4d8" font-size="17">经过权限过滤的搜索</text><text x="460" y="479" fill="#d4d4d8" font-size="17">新鲜度 · 相关性 · 来源</text>
    <rect x="800" y="387" width="330" height="116" rx="18" fill="#3f3f46"/>
    <text x="825" y="424" fill="#f4f4f5" font-size="21" font-weight="700">系统事实源</text><text x="825" y="454" fill="#d4d4d8" font-size="17">当前业务事实</text><text x="825" y="479" fill="#d4d4d8" font-size="17">冲突时拥有最高优先级</text>
    <rect x="290" y="545" width="620" height="88" rx="44" fill="#4c1d95" stroke="#c4b5fd" stroke-width="2"/>
    <text x="600" y="581" text-anchor="middle" fill="#ede9fe" font-size="23" font-weight="700">上下文组装 → 模型 → 策略 → 工具</text>
    <text x="600" y="611" text-anchor="middle" fill="#ddd6fe" font-size="17">评测与审计覆盖整个路径</text>
    <text x="70" y="680" fill="#94a3b8" font-size="17">记忆不能覆盖当前权威记录。</text>
  </g>
</svg>
