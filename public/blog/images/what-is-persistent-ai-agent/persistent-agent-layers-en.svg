<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Persistence layers in an AI agent</title>
  <desc id="desc">A model call is surrounded by session context, run state, durable memory, retrieval, systems of record, and evaluation and audit.</desc>
  <rect width="1200" height="720" rx="32" fill="#0b1020"/>
  <text x="70" y="78" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">Persistence is a system, not a model feature</text>
  <text x="70" y="118" fill="#94a3b8" font-family="Arial, sans-serif" font-size="19">Each layer has a different owner, lifetime, and source of truth</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="165" width="1060" height="76" rx="18" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <text x="95" y="198" fill="#dbeafe" font-size="22" font-weight="700">Identity &amp; policy</text><text x="95" y="226" fill="#bfdbfe" font-size="17">tenant · user · project · roles · approval boundaries</text>
    <rect x="70" y="261" width="510" height="106" rx="18" fill="#164e63"/>
    <text x="95" y="298" fill="#cffafe" font-size="21" font-weight="700">Session context</text><text x="95" y="328" fill="#a5f3fc" font-size="17">recent turns · compacted history</text><text x="95" y="352" fill="#a5f3fc" font-size="17">short-lived continuity</text>
    <rect x="620" y="261" width="510" height="106" rx="18" fill="#134e4a"/>
    <text x="645" y="298" fill="#ccfbf1" font-size="21" font-weight="700">Run state</text><text x="645" y="328" fill="#99f6e4" font-size="17">checkpoint · retry · approval · receipt</text><text x="645" y="352" fill="#99f6e4" font-size="17">safe pause and resume</text>
    <rect x="70" y="387" width="330" height="116" rx="18" fill="#3f3f46"/>
    <text x="95" y="424" fill="#f4f4f5" font-size="21" font-weight="700">Durable memory</text><text x="95" y="454" fill="#d4d4d8" font-size="17">selected facts · preferences</text><text x="95" y="479" fill="#d4d4d8" font-size="17">provenance · expiry · correction</text>
    <rect x="435" y="387" width="330" height="116" rx="18" fill="#3f3f46"/>
    <text x="460" y="424" fill="#f4f4f5" font-size="21" font-weight="700">Retrieval</text><text x="460" y="454" fill="#d4d4d8" font-size="17">permission-filtered search</text><text x="460" y="479" fill="#d4d4d8" font-size="17">freshness · relevance · citations</text>
    <rect x="800" y="387" width="330" height="116" rx="18" fill="#3f3f46"/>
    <text x="825" y="424" fill="#f4f4f5" font-size="21" font-weight="700">Systems of record</text><text x="825" y="454" fill="#d4d4d8" font-size="17">current business facts</text><text x="825" y="479" fill="#d4d4d8" font-size="17">authoritative when conflicts arise</text>
    <rect x="290" y="545" width="620" height="88" rx="44" fill="#4c1d95" stroke="#c4b5fd" stroke-width="2"/>
    <text x="600" y="581" text-anchor="middle" fill="#ede9fe" font-size="23" font-weight="700">Context builder → model → policy → tool</text>
    <text x="600" y="611" text-anchor="middle" fill="#ddd6fe" font-size="17">Evaluation and audit observe the full path</text>
    <text x="70" y="680" fill="#94a3b8" font-size="17">Memory never overrides the current authoritative record.</text>
  </g>
</svg>
