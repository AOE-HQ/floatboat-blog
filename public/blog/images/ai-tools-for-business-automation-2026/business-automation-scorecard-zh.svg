<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 商业自动化工具统一评分表</title><desc id="desc">围绕同一条固定工作流，比较任务适配、成本单位、权限数据、集成质量、可观测恢复、评测与退出能力七个维度。</desc>
  <rect width="1200" height="720" rx="32" fill="#0b1020"/>
  <text x="70" y="78" fill="#f8fafc" font-family="Arial, Microsoft YaHei, sans-serif" font-size="34" font-weight="700">用同一条工作流比较工具</text>
  <text x="70" y="118" fill="#94a3b8" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19">相同输入 · 相同权限 · 相同验收规则</text>
  <rect x="420" y="175" width="360" height="110" rx="28" fill="#172554" stroke="#60a5fa" stroke-width="3"/>
  <text x="600" y="220" text-anchor="middle" fill="#dbeafe" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25" font-weight="700">固定工作流试点</text>
  <text x="600" y="255" text-anchor="middle" fill="#bfdbfe" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17">正常案例 + 失败案例</text>
  <g font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="700">
    <g><rect x="80" y="335" width="300" height="76" rx="17" fill="#134e4a"/><text x="105" y="382" fill="#ccfbf1">1 · 任务适配</text></g>
    <g><rect x="450" y="335" width="300" height="76" rx="17" fill="#3f3f46"/><text x="475" y="382" fill="#f4f4f5">2 · 成本单位</text></g>
    <g><rect x="820" y="335" width="300" height="76" rx="17" fill="#3f3f46"/><text x="845" y="382" fill="#f4f4f5">3 · 权限与数据</text></g>
    <g><rect x="80" y="450" width="300" height="76" rx="17" fill="#3f3f46"/><text x="105" y="497" fill="#f4f4f5">4 · 集成质量</text></g>
    <g><rect x="450" y="450" width="300" height="76" rx="17" fill="#3f3f46"/><text x="475" y="485" fill="#f4f4f5">5 · 可观测性</text><text x="475" y="508" fill="#d4d4d8" font-size="16">与故障恢复</text></g>
    <g><rect x="820" y="450" width="300" height="76" rx="17" fill="#3f3f46"/><text x="845" y="497" fill="#f4f4f5">6 · 评测与变更</text></g>
    <g><rect x="450" y="565" width="300" height="76" rx="17" fill="#4c1d95"/><text x="475" y="612" fill="#ede9fe">7 · 退出能力</text></g>
  </g>
  <text x="70" y="680" fill="#94a3b8" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17">按证据给 0～3 分；成本按验收结果计算，而不是按订阅数量计算。</text>
</svg>
