<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">OpenAI DevDay 2026 release status map</title><desc id="d">Four columns distinguish available products, beta and alpha products, previews and coming-soon products, and enterprise approval paths.</desc><rect width="1200" height="560" fill="#f7f0e5"/><g font-family="Arial,sans-serif" fill="#17131f"><text x="60" y="62" font-size="30" font-weight="700">Announcement is not an availability status</text><text x="60" y="98" font-size="17" fill="#5d5563">Status checked October 10, 2026 · plan, market, admin, and client restrictions may still apply</text><g transform="translate(60 140)"><rect width="255" height="330" rx="17" fill="#fff" stroke="#17131f" stroke-width="2"/><text x="24" y="43" font-size="21" font-weight="700">AVAILABLE</text><text x="24" y="76" font-size="15">Dots · Sol · Ultrafast</text><text x="24" y="103" font-size="15">Codex cloud / CLI / review</text><text x="24" y="130" font-size="15">Agents API computer use</text><text x="24" y="157" font-size="15">Plugins · Sites · Events</text><text x="24" y="184" font-size="15">Space · Pages · team tasks</text><text x="24" y="226" font-size="14" fill="#6f43c0">Check exact surface</text><text x="24" y="251" font-size="14" fill="#6f43c0">and eligibility</text></g><g transform="translate(335 140)"><rect width="255" height="330" rx="17" fill="#ede4ff" stroke="#6f43c0" stroke-width="3"/><text x="24" y="43" font-size="21" font-weight="700">BETA / ALPHA</text><text x="24" y="76" font-size="15">Decisions API · public beta</text><text x="24" y="103" font-size="15">Meetings · macOS beta</text><text x="24" y="130" font-size="15">Meetings Enterprise · alpha</text><text x="24" y="226" font-size="14" fill="#6f43c0">Expect change</text><text x="24" y="251" font-size="14" fill="#6f43c0">keep a fallback</text></g><g transform="translate(610 140)"><rect width="255" height="330" rx="17" fill="#fff" stroke="#17131f" stroke-width="2"/><text x="24" y="43" font-size="21" font-weight="700">NOT YET SHIPPED</text><text x="24" y="76" font-size="15">Private Inference preview</text><text x="24" y="103" font-size="15">Collaborative slides</text><text x="24" y="130" font-size="15">Space mobile editing</text><text x="24" y="157" font-size="15">Meetings on other clients</text><text x="24" y="226" font-size="14" fill="#6f43c0">Do not promise</text><text x="24" y="251" font-size="14" fill="#6f43c0">as current capability</text></g><g transform="translate(885 140)"><rect width="255" height="330" rx="17" fill="#ffd966" stroke="#17131f" stroke-width="2"/><text x="24" y="43" font-size="21" font-weight="700">APPROVAL PATH</text><text x="24" y="76" font-size="15">OpenAI Marketplace</text><text x="24" y="103" font-size="15">Enterprise interest</text><text x="24" y="130" font-size="15">and eligibility</text><text x="24" y="226" font-size="14">Procurement access</text><text x="24" y="251" font-size="14">is not end-user GA</text></g></g></svg>
