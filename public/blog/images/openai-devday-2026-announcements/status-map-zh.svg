<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">OpenAI DevDay 2026 发布状态图</title><desc id="d">分为已开放、Beta 或 Alpha、尚未上线，以及企业申请四类。</desc><rect width="1200" height="560" fill="#f7f0e5"/><g font-family="Microsoft YaHei,sans-serif" fill="#17131f"><text x="60" y="62" font-size="30" font-weight="700">发布会宣布，不等于现在已经可用</text><text x="60" y="98" font-size="17" fill="#5d5563">状态核对时间：2026 年 10 月 10 日 · 仍可能受套餐、市场、管理员和客户端限制</text><g transform="translate(60 140)"><rect width="255" height="330" rx="17" fill="#fff" stroke="#17131f" stroke-width="2"/><text x="24" y="43" font-size="21" font-weight="700">已开放</text><text x="24" y="76" font-size="15">Dots · Sol · Ultrafast</text><text x="24" y="103" font-size="15">Codex Cloud / CLI / Review</text><text x="24" y="130" font-size="15">Agents API Computer Use</text><text x="24" y="157" font-size="15">Plugins · Sites · Events</text><text x="24" y="184" font-size="15">Space · Pages · Team Tasks</text><text x="24" y="226" font-size="14" fill="#6f43c0">仍要核对入口</text><text x="24" y="251" font-size="14" fill="#6f43c0">与账号条件</text></g><g transform="translate(335 140)"><rect width="255" height="330" rx="17" fill="#ede4ff" stroke="#6f43c0" stroke-width="3"/><text x="24" y="43" font-size="21" font-weight="700">Beta / Alpha</text><text x="24" y="76" font-size="15">Decisions API · Public Beta</text><text x="24" y="103" font-size="15">Meetings · macOS Beta</text><text x="24" y="130" font-size="15">Meetings Enterprise · Alpha</text><text x="24" y="226" font-size="14" fill="#6f43c0">预期会变化</text><text x="24" y="251" font-size="14" fill="#6f43c0">必须保留降级方案</text></g><g transform="translate(610 140)"><rect width="255" height="330" rx="17" fill="#fff" stroke="#17131f" stroke-width="2"/><text x="24" y="43" font-size="21" font-weight="700">尚未上线</text><text x="24" y="76" font-size="15">Private Inference Preview</text><text x="24" y="103" font-size="15">Collaborative Slides</text><t