<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
  <title id="t">Decision path for AI automation delivery</title><desc id="d">A decision tree using process stability, internal ownership, recurring demand, and specialist complexity to choose wait, DIY, hire, or agency.</desc>
  <rect width="1200" height="600" fill="#f7f0e5"/><g font-family="Arial,sans-serif" fill="#17131f">
  <text x="60" y="62" font-size="30" font-weight="700">Choose the delivery model after the workflow is clear</text>
  <g transform="translate(430 105)"><rect width="340" height="78" rx="15" fill="#fff" stroke="#17131f" stroke-width="2"/><text x="170" y="32" text-anchor="middle" font-size="18" font-weight="700">Is the process stable and measurable?</text><text x="170" y="57" text-anchor="middle" font-size="14">trigger · output · exceptions · owner</text></g>
  <path d="M430 144H235v82M770 144h195v82" fill="none" stroke="#6f43c0" stroke-width="4"/><text x="325" y="132" font-size="15">No</text><text x="850" y="132" font-size="15">Yes</text>
  <g transform="translate(90 226)"><rect width="290" height="110" rx="15" fill="#ffd966" stroke="#17131f" stroke-width="2"/><text x="145" y="42" text-anchor="middle" font-size="23" font-weight="700">WAIT</text><text x="145" y="72" text-anchor="middle" font-size="15">map cases and name an owner</text></g>
  <g transform="translate(820 226)"><rect width="290" height="110" rx="15" fill="#ede4ff" stroke="#6f43c0" stroke-width="3"/><text x="145" y="38" text-anchor="middle" font-size="18" font-weight="700">Can one internal owner build</text><text x="145" y="62" text-anchor="middle" font-size="18" font-weight="700">and maintain a safe version?</text></g>
  <path d="M965 336v52H620M965 388h135" fill="none" stroke="#6f43c0" stroke-width="4"/><text x="780" y="376" font-size="15">No</text><text x="1035" y="376" font-size="15">Yes</text>
  <g transform="translate(930 408)"><rect width="220" height="110" rx="15" fill="#fff" stroke="#17131f" stroke-width="2"/><text x="110" y="44" text-anchor="middle" font-size="23" font-weight="700">DIY</text><text x="110" y="74" text-anchor="middle" font-size="15">narrow and reversible</text></g>
  <g transform="translate(430 408)"><rect width="380" height="110" rx="15" fill="#fff" stroke="#17131f" stroke-width="2"/><text x="190" y="35" text-anchor="middle" font-size="17" font-weight="700">Is the need continuous and cumulative?</text><text x="100" y="74" text-anchor="middle" font-size="22" font-weight="700">HIRE</text><text x="280" y="74" text-anchor="middle" font-size="22" font-weight="700">AGENCY</text><text x="100" y="96" text-anchor="middle" font-size="13">recurring portfolio</text><text x="280" y="96" text-anchor="middle" font-size="13">bounded complexity</text><path d="M190 48v58" stroke="#d4c7df" stroke-width="2"/></g>
  </g></svg>
