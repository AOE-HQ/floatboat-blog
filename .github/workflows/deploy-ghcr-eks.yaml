name: Deploy Blog to EKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: deploy-floatboat-blog
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  EKS_CLUSTER_NAME: scrumptious-jazz-rainbow
  K8S_NAMESPACE: aoe
  K8S_DEPLOYMENT: floatboat-blog
  K8S_CONTAINER: floatboat-blog
  IMAGE_PULL_SECRET: ghcr-pull-secret
  SITE_URL: https://floatboat.ai
  DEPLOY_MODE: subdirectory
  BLOG_BASE_PATH: /blog
  ASSET_PREFIX: /blog
  NEXT_PUBLIC_ATTRIBUTION_WEB_EVENTS_ENABLED: "true"
  NEXT_PUBLIC_ATTRIBUTION_WEB_EVENT_URL: https://floatboat.ai/api/analytics/events
  PREVIEW_URL: https://blog.floatboat.ai

jobs:
  check:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install

      - run: npm run validate:posts

      - run: npm run check:images

      - run: npm run build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: check
    outputs:
      name: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            SITE_URL=${{ env.SITE_URL }}
            DEPLOY_MODE=${{ env.DEPLOY_MODE }}
            BLOG_BASE_PATH=${{ env.BLOG_BASE_PATH }}
            ASSET_PREFIX=${{ env.ASSET_PREFIX }}
            NEXT_PUBLIC_ATTRIBUTION_WEB_EVENTS_ENABLED=${{ env.NEXT_PUBLIC_ATTRIBUTION_WEB_EVENTS_ENABLED }}
            NEXT_PUBLIC_ATTRIBUTION_WEB_EVENT_URL=${{ env.NEXT_PUBLIC_ATTRIBUTION_WEB_EVENT_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: image
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "${AWS_REGION}" --name "${EKS_CLUSTER_NAME}"

      - name: Validate image pull secret
        run: kubectl -n "${K8S_NAMESPACE}" get secret "${IMAGE_PULL_SECRET}" >/dev/null

      - name: Deploy immutable image with rollback
        env:
          IMAGE_URI: ${{ needs.image.outputs.name }}@${{ needs.image.outputs.digest }}
        run: bash scripts/deploy.sh

      - name: Verify public health
        run: |
          curl --fail --show-error --silent --retry 20 --retry-all-errors --retry-delay 15 \
            "${PREVIEW_URL}/blog" >/dev/null
