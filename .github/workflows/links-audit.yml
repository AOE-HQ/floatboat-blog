name: Links Audit

on:
  pull_request:
    paths:
      - 'content/**'
      - 'scripts/audit-links.py'
      - 'scripts/reports/links-baseline.json'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit internal/external links
        run: python scripts/audit-links.py --ci
