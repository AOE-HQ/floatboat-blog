name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_URL: https://floatboat.ai
  DEPLOY_MODE: subdirectory
  BLOG_BASE_PATH: /blog
  ASSET_PREFIX: /blog
  NEXT_PUBLIC_ATTRIBUTION_WEB_EVENTS_ENABLED: "true"
  IMAGE_NAME: ghcr.io/aoe-hq/floatboat-blog

jobs:
  check:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install

      - run: npm run validate:posts

      - run: npm run build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            SITE_URL=${{ env.SITE_URL }}
            DEPLOY_MODE=${{ env.DEPLOY_MODE }}
            BLOG_BASE_PATH=${{ env.BLOG_BASE_PATH }}
            ASSET_PREFIX=${{ env.ASSET_PREFIX }}
            NEXT_PUBLIC_ATTRIBUTION_WEB_EVENTS_ENABLED=${{ env.NEXT_PUBLIC_ATTRIBUTION_WEB_EVENTS_ENABLED }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
